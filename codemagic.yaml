workflows:
  monarch-codex-android:
    name: Monarch Codex Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      android_signing:
        - monarch_codex_permanent
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
    scripts:
      - name: Generate Android project files
        script: |
          flutter create --platforms=android --project-name monarch_codex --org online.monarchcodex .
      - name: Configure permanent Android release signing
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")
          p = kts if kts.exists() else groovy
          assert p.exists(), "Flutter did not generate an Android Gradle build file"
          s = p.read_text()
          if p.suffix == ".kts":
              if 'create("release")' not in s:
                  marker = "    buildTypes {"
                  assert marker in s, "Could not locate Kotlin Gradle buildTypes block"
                  signing = '''    signingConfigs {
                  create("release") {
                      if (System.getenv()["CI"].toBoolean()) {
                          storeFile = file(System.getenv()["CM_KEYSTORE_PATH"])
                          storePassword = System.getenv()["CM_KEYSTORE_PASSWORD"]
                          keyAlias = System.getenv()["CM_KEY_ALIAS"]
                          keyPassword = System.getenv()["CM_KEY_PASSWORD"]
                      }
                  }
              }

          '''
                  s = s.replace(marker, signing + marker, 1)
              s, count = re.subn(r'(release\s*\{[^}]*?)signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)', r'\1signingConfig = signingConfigs.getByName("release")', s, count=1, flags=re.S)
              if count == 0:
                  s, count = re.subn(r'(release\s*\{)', r'\1\n            signingConfig = signingConfigs.getByName("release")', s, count=1)
                  assert count == 1, "Could not wire release signing in Kotlin Gradle file"
          else:
              if "signingConfigs {" not in s:
                  marker = "    buildTypes {"
                  assert marker in s, "Could not locate Groovy Gradle buildTypes block"
                  signing = '''    signingConfigs {
                  release {
                      if (System.getenv()["CI"]) {
                          storeFile file(System.getenv()["CM_KEYSTORE_PATH"])
                          storePassword System.getenv()["CM_KEYSTORE_PASSWORD"]
                          keyAlias System.getenv()["CM_KEY_ALIAS"]
                          keyPassword System.getenv()["CM_KEY_PASSWORD"]
                      }
                  }
              }

          '''
                  s = s.replace(marker, signing + marker, 1)
              s, count = re.subn(r'(release\s*\{[^}]*?)signingConfig\s+signingConfigs\.debug', r'\1signingConfig signingConfigs.release', s, count=1, flags=re.S)
              if count == 0:
                  s, count = re.subn(r'(release\s*\{)', r'\1\n            signingConfig signingConfigs.release', s, count=1)
                  assert count == 1, "Could not wire release signing in Groovy Gradle file"
          p.write_text(s)
          assert "signingConfigs" in p.read_text() and "signingConfigs.getByName(\"release\")" in p.read_text() or "signingConfig signingConfigs.release" in p.read_text()
          PY
      - name: Enable internet access
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in s:
              s, count = re.subn(r'(<manifest\b[^>]*>)', r'\1\n    ' + permission, s, count=1)
              assert count == 1, "Could not find the Android manifest root tag"
          p.write_text(s)
          assert permission in p.read_text()
          PY
      - name: Prepare launcher icon artwork
        script: |
          brew list librsvg >/dev/null 2>&1 || brew install librsvg
          rsvg-convert -w 1024 -h 1024 assets/images/monarch-codex-app-icon.svg > assets/images/monarch-codex-app-icon.png
          test -s assets/images/monarch-codex-app-icon.png
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Generate launcher icons
        script: dart run flutter_launcher_icons
      - name: Set app display name
        script: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text().replace('android:label="monarch_codex"', 'android:label="Monarch Codex"')
          p.write_text(s)
          PY
      - name: Build release APK
        script: flutter build apk --release
      - name: Verify APK exists and calculate checksum
        script: |
          set -e
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          shasum -a 256 "$APK" | tee build/app/outputs/flutter-apk/app-release.apk.sha256
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/flutter-apk/app-release.apk.sha256
