workflows:
  monarch-codex-android:
    name: Monarch Codex Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      android_signing:
        - monarch_codex_permanent
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
    scripts:
      - name: Generate Android project files
        script: |
          flutter create --platforms=android --project-name monarch_codex --org online.monarchcodex .
      - name: Configure permanent Android release signing
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")
          p = kts if kts.exists() else groovy
          assert p.exists(), "Flutter did not generate an Android Gradle build file"
          s = p.read_text()
          if p.suffix == ".kts":
              if 'create("release")' not in s:
                  marker = "    buildTypes {"
                  assert marker in s, "Could not locate Kotlin Gradle buildTypes block"
                  signing = '''    signingConfigs {
                  create("release") {
                      if (System.getenv()["CI"].toBoolean()) {
                          storeFile = System.getenv("CM_KEYSTORE_PATH")?.let { file(it) } ?: error("CM_KEYSTORE_PATH is not configured")
                          storePassword = System.getenv()["CM_KEYSTORE_PASSWORD"]
                          keyAlias = System.getenv()["CM_KEY_ALIAS"]
                          keyPassword = System.getenv()["CM_KEY_PASSWORD"]
                      }
                  }
              }

          '''
                  s = s.replace(marker, signing + marker, 1)
              s, count = re.subn(r'(release\s*\{[^}]*?)signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)', r'\1signingConfig = signingConfigs.getByName("release")', s, count=1, flags=re.S)
              if count == 0:
                  s, count = re.subn(r'(release\s*\{)', r'\1\n            signingConfig = signingConfigs.getByName("release")', s, count=1)
                  assert count == 1, "Could not wire release signing in Kotlin Gradle file"
          else:
              if "signingConfigs {" not in s:
                  marker = "    buildTypes {"
                  assert marker in s, "Could not locate Groovy Gradle buildTypes block"
                  signing = '''    signingConfigs {
                  release {
                      if (System.getenv()["CI"]) {
                          storeFile file(System.getenv()["CM_KEYSTORE_PATH"])
                          storePassword System.getenv()["CM_KEYSTORE_PASSWORD"]
                          keyAlias System.getenv()["CM_KEY_ALIAS"]
                          keyPassword System.getenv()["CM_KEY_PASSWORD"]
                      }
                  }
              }

          '''
                  s = s.replace(marker, signing + marker, 1)
              s, count = re.subn(r'(release\s*\{[^}]*?)signingConfig\s+signingConfigs\.debug', r'\1signingConfig signingConfigs.release', s, count=1, flags=re.S)
              if count == 0:
                  s, count = re.subn(r'(release\s*\{)', r'\1\n            signingConfig signingConfigs.release', s, count=1)
                  assert count == 1, "Could not wire release signing in Groovy Gradle file"
          p.write_text(s)
          assert "signingConfigs" in p.read_text() and "signingConfigs.getByName(\"release\")" in p.read_text() or "signingConfig signingConfigs.release" in p.read_text()
          PY
      - name: Enable internet access
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in s:
              s, count = re.subn(r'(<manifest\b[^>]*>)', r'\1\n    ' + permission, s, count=1)
              assert count == 1, "Could not find the Android manifest root tag"
          p.write_text(s)
          assert permission in p.read_text()
          PY
      - name: Prepare launcher icon artwork
        script: |
          brew list librsvg >/dev/null 2>&1 || brew install librsvg
          rsvg-convert -w 1024 -h 1024 assets/images/monarch-codex-app-icon.svg > assets/images/monarch-codex-app-icon.png
          test -s assets/images/monarch-codex-app-icon.png
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Generate launcher icons
        script: dart run flutter_launcher_icons
      - name: Set app display name
        script: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text().replace('android:label="monarch_codex"', 'android:label="Monarch Codex"')
          p.write_text(s)
          PY
      - name: Build release APK
        script: flutter build apk --release
      - name: Verify APK exists and calculate checksum
        script: |
          set -e
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          shasum -a 256 "$APK" | tee build/app/outputs/flutter-apk/app-release.apk.sha256
      - name: Publish migration APK release for in-app updates
        script: |
          set -e
          if [ -z "${MONARCH_ANDROID_RELEASE_TOKEN:-}" ]; then
            echo "WARNING: MONARCH_ANDROID_RELEASE_TOKEN is not configured in CodeMagic; APK built but automatic in-app update publishing was skipped."
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          owner_repo = "trademonarchcodes/monarch-codex-android"
          token = os.environ["MONARCH_ANDROID_RELEASE_TOKEN"]
          version_text = Path("pubspec.yaml").read_text()
          match = re.search(r"^version:\s*([0-9]+\.[0-9]+\.[0-9]+\+[0-9]+)\s*$", version_text, re.M)
          if not match:
              raise SystemExit("Could not read version from pubspec.yaml")
          version = match.group(1)
          body = "Version: " + version + "\nMandatory: false\n\nMonarch Codex Android migration app. This build uses a separate Android application identity because the previous signing identity is unavailable. Install side-by-side with the legacy app."
          api = "https://api.github.com/repos/" + owner_repo
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Monarch-Codex-CodeMagic-Publisher",
              "Content-Type": "application/json",
          }

          def request(url, method="GET", data=None, extra_headers=None):
              h = dict(headers)
              if extra_headers:
                  h.update(extra_headers)
              req = urllib.request.Request(url, data=data, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      payload = response.read()
                      return json.loads(payload) if payload else {}
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace")[:500]
                  raise SystemExit("GitHub release publishing failed (HTTP " + str(exc.code) + "): " + detail)

          try:
              release = request(api + "/releases/tags/migration-apk")
          except SystemExit as exc:
              if "HTTP 404" not in str(exc):
                  raise
              release = request(api + "/releases", "POST", json.dumps({
                  "tag_name": "migration-apk",
                  "target_commitish": "main",
                  "name": "Monarch Codex Android — Migration",
                  "body": body,
                  "draft": False,
                  "prerelease": False,
              }).encode())
          else:
              release = request(api + "/releases/" + str(release["id"]), "PATCH", json.dumps({
                  "name": "Monarch Codex Android — Migration",
                  "body": body,
                  "draft": False,
                  "prerelease": False,
              }).encode())

          for asset in release.get("assets", []):
              request(api + "/releases/assets/" + str(asset["id"]), "DELETE")
          upload_url = release["upload_url"].split("{", 1)[0]
          for filename, content_type in [
              ("build/app/outputs/flutter-apk/app-release.apk", "application/vnd.android.package-archive"),
              ("build/app/outputs/flutter-apk/app-release.apk.sha256", "text/plain"),
          ]:
              path = Path(filename)
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit("Required release asset is missing: " + filename)
              url = upload_url + "?name=" + urllib.parse.quote(path.name)
              req = urllib.request.Request(
                  url,
                  data=path.read_bytes(),
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "Monarch-Codex-CodeMagic-Publisher",
                      "Content-Type": content_type,
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=180) as response:
                      response.read()
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace")[:500]
                  raise SystemExit("Could not upload " + path.name + " (HTTP " + str(exc.code) + "): " + detail)
              print("Published release asset: " + path.name)
          print("Published migration-channel in-app update version " + version)
          PY
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/flutter-apk/app-release.apk.sha256
