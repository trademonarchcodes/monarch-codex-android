name: monarch_codex
description: Monarch Codex member app
publish_to: "none"
version: 0.1.4+5

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0
  file_picker: ^10.3.2
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.2.0
  path_provider: ^2.1.5
  flutter_svg: ^2.0.17
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.0
  open_filex: ^4.7.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/monarch-codex-logo.svg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/monarch-codex-app-icon.png"
  adaptive_icon_background: "#09090B"
  adaptive_icon_foreground: "assets/images/monarch-codex-app-icon.png"
