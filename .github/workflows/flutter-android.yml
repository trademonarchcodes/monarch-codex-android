name: Flutter checks and Android APK
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      # Generate Android scaffolding, then install the official Monarch Codex launcher artwork.
      - run: flutter create --platforms=android --project-name monarch_codex --org online.monarchcodex .
      # Release builds need INTERNET in the main manifest; Flutter's generated debug manifest alone is not enough.
      - name: Enable network access in release APK
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: rsvg-convert -w 1024 -h 1024 assets/images/monarch-codex-app-icon.svg > assets/images/monarch-codex-app-icon.png
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: sed -i 's/android:label="monarch_codex"/android:label="Monarch Codex"/' android/app/src/main/AndroidManifest.xml
      - run: dart format --output=none lib
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: monarch-codex-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct APK download on main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Monarch Codex Android build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          files: build/app/outputs/flutter-apk/app-release.apk
