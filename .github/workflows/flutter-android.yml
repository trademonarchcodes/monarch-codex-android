name: Flutter checks and Android APK
on:
  push:
    branches: [main, "codex/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  flutter:
    runs-on: ubuntu-24.04
    env:
      ANDROID_SIGNING_CONFIGURED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      # Generate Android scaffolding, then install the official Monarch Codex launcher artwork.
      - run: flutter create --platforms=android --project-name monarch_codex --org online.monarchcodex .
      # Release builds need INTERNET in the main manifest; Flutter's generated debug manifest alone is not enough.
      - name: Enable network access in release APK
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: rsvg-convert -w 1024 -h 1024 assets/images/monarch-codex-app-icon.svg > assets/images/monarch-codex-app-icon.png
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: sed -i 's/android:label="monarch_codex"/android:label="Monarch Codex"/' android/app/src/main/AndroidManifest.xml
      - run: dart format lib
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Configure stable Android release signing
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/monarch-release.jks
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle.kts")
          content = path.read_text()
          if 'signingConfigs.getByName("debug")' not in content:
              raise SystemExit("Expected generated Flutter debug signing configuration was not found.")
          signing = '''  signingConfigs {
              create("release") {
                  storeFile = file("monarch-release.jks")
                  storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
              }
          }

          '''
          if 'create("release")' not in content:
              content = content.replace("  buildTypes {", signing + "  buildTypes {", 1)
          content = content.replace('signingConfig = signingConfigs.getByName("debug")',
                                    'signingConfig = signingConfigs.getByName("release")', 1)
          path.write_text(content)
          PY
          grep -q 'signingConfigs.getByName("release")' android/app/build.gradle.kts
      - name: Build signed Android release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Read app version
        id: app_version
        run: |
          echo "version=$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Generate APK checksum
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: monarch-codex-android-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish latest APK and checksum
        if: github.ref == 'refs/heads/main' && env.ANDROID_SIGNING_CONFIGURED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Monarch Codex Android — Latest APK
          body: |
            Version: ${{ steps.app_version.outputs.version }}

            Automatically updated release containing the latest successfully built Monarch Codex Android APK. The SHA-256 checksum is published beside the APK.
          prerelease: true
          generate_release_notes: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          overwrite_files: true
          fail_on_unmatched_files: true
