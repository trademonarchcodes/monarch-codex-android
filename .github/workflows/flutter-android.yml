name: Flutter checks and Android APK
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      # This repository contains Flutter sources but did not include the Android platform scaffold.
      # Generate the standard Android project files in the checked-out workspace before building.
      - run: flutter create --platforms=android --project-name monarch_codex --org online.monarchcodex .
      - run: flutter pub get
      - run: dart format --output=none lib
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: monarch-codex-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
