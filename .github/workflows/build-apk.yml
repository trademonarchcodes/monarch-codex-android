name: Build Monarch Codex Android APK

on:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

concurrency:
  group: monarch-codex-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: flutter create --platforms=android --org online.monarchcodex --project-name monarch_codex .

      - name: Set Android compile SDK to 36 for receipt picker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          build_file = next((p for p in candidates if p.exists()), None)
          if build_file is None:
              raise SystemExit("Android app Gradle file was not generated")
          source = build_file.read_text()
          patterns = [
              (r"compileSdk\s*=\s*flutter\.compileSdkVersion", "compileSdk = 36"),
              (r"compileSdkVersion\s+flutter\.compileSdkVersion", "compileSdkVersion 36"),
              (r"compileSdk\s*=\s*\d+", "compileSdk = 36"),
              (r"compileSdkVersion\s+\d+", "compileSdkVersion 36"),
          ]
          updated = source
          for pattern, replacement in patterns:
              updated, count = re.subn(pattern, replacement, updated, count=1)
              if count:
                  break
          if updated == source:
              raise SystemExit("Could not safely update compileSdk in " + str(build_file))
          build_file.write_text(updated)
          if not re.search(r"compileSdk(?:Version)?\s*(?:=\s*)?36", updated):
              raise SystemExit("compileSdk 36 verification failed")
          print("Set app compile SDK to 36 in", build_file)


          PY

      - name: Set Android display name
        run: sed -i 's/android:label="monarch_codex"/android:label="Monarch Codex"/' android/app/src/main/AndroidManifest.xml

      - name: Ensure internet permission is present in release manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = path.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in manifest:
              opening = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
              if opening not in manifest:
                  raise SystemExit("Could not safely find the Android manifest opening tag")
              manifest = manifest.replace(opening, opening + '\n    ' + permission, 1)
              path.write_text(manifest)
          if permission not in path.read_text():
              raise SystemExit("INTERNET permission is missing from AndroidManifest.xml")
          PY

      - name: Apply official Monarch Codex launcher icon
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick
          RES="android/app/src/main/res"
          mkdir -p "$RES/drawable" "$RES/mipmap-anydpi-v26"
          rsvg-convert --width=432 --height=432 assets/images/monarch-codex-logo.svg > /tmp/monarch-codex-logo.png
          cat > "$RES/drawable/monarch_icon_background.xml" <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#09090B" />
          </shape>
          EOF
          for spec in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            read -r density icon_size foreground_size <<< "$spec"
            dir="$RES/mipmap-$density"
            mkdir -p "$dir"
            convert -size "${icon_size}x${icon_size}" xc:'#09090B' \
              \( /tmp/monarch-codex-logo.png -resize "${icon_size}x${icon_size}" \) \
              -gravity center -composite "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            convert /tmp/monarch-codex-logo.png -resize "${foreground_size}x${foreground_size}" "$dir/ic_launcher_foreground.png"
          done
          for name in ic_launcher ic_launcher_round; do
            cat > "$RES/mipmap-anydpi-v26/$name.xml" <<EOF
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/monarch_icon_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          done

      - name: Resolve dependencies
        run: flutter pub get

      - name: Set compile SDK for cached Flutter plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          candidates = list(cache.glob("*/android/build.gradle")) + list(cache.glob("*/android/build.gradle.kts"))
          if not candidates:
              raise SystemExit("No cached Flutter plugin Android Gradle files found")

          changed = []
          declaration = re.compile(
              r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)*)(?:flutter\.compileSdkVersion|34)\b"
          )
          for build_file in candidates:
              source = build_file.read_text()
              updated, count = declaration.subn(r"\g<1>36", source)
              if count:
                  build_file.write_text(updated)
                  changed.append(str(build_file))

          picker_files = [p for p in candidates if p.parent.parent.name.startswith("file_picker-")]
          if not picker_files:
              raise SystemExit("file_picker Android Gradle file was not found in pub cache")

          # Check Groovy and Kotlin Gradle declaration styles explicitly.
          for picker_file in picker_files:
              source = picker_file.read_text()
              declarations = re.findall(r"(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?([^\s;]+)", source)
              if not declarations or not all(value.strip().strip(")") == "36" for value in declarations):
                  raise SystemExit(f"file_picker compile SDK is not explicitly 36 in {picker_file}: {declarations}")

          print("Updated cached plugin compile SDK declarations:", changed)
          print("Verified file_picker Android Gradle declarations use API 36.")
          PY

      - name: Analyze Flutter source
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify release APK has internet permission
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee /tmp/monarch-apk-permissions.txt
          grep -q "android.permission.INTERNET" /tmp/monarch-apk-permissions.txt

      - name: Read app version
        id: app_version
        run: echo "version=$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Generate APK checksum
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/app-release.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: monarch-codex-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Monarch Codex Android build ${{ github.run_number }}
          body: |
            Version: ${{ steps.app_version.outputs.version }}

            Archived build artifact for this workflow run. The stable latest-apk release is maintained by the primary Flutter APK workflow.
          prerelease: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          fail_on_unmatched_files: true
